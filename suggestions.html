<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Suggestions</title>

  <link rel="icon" type="image/png" href="assets/favicon3.png">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
</head>

<body>

  <div id="vanta-bg"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Home">
      <img src="assets/newicon2.png" alt="">
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-button">Gaming</a>
      <a href="movies.html" class="nav-button">Movies</a>
      <a href="suggestions.html" class="nav-button active">Suggestions</a>
    </nav>
  </header>

  <main class="suggestions-page">
    <div class="suggestions-panel">

      <div class="suggestions-header">
        <p class="eyebrow">Suggestions</p>
        <h1>Have a suggestion?</h1>
        <p>
          Want to see a game or movie added? Let me know!
        </p>
      </div>

      <div class="form-container">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSe0gk2WJzLVt24T411f2qlHd_fyHFJPqAeX4EENHHwPlaLrWw/viewform?embedded=true"
          width="100%"
          height="650"
          frameborder="0"
          marginheight="0"
          marginwidth="0">
          Loading…
        </iframe>
      </div>

    </div>
  </main>

  <script>
    function startFog() {
      if (!window.VANTA?.FOG) return;

      window.VANTA.FOG({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        highlightColor: 0xffce,
        midtoneColor: 0xffce,
        lowlightColor: 0xffce,
        baseColor: 0x000000,
        blurFactor: 0.26,
        speed: 0.80,
        zoom: 0.40
      });
    }

    startFog();
  </script>

</body>
</html>
